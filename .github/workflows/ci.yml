
name: Email Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: email_service
          POSTGRES_USER: storeuser
          POSTGRES_PASSWORD: storepassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storeuser -d email_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests and package
        env:
          DB_URL: jdbc:postgresql://localhost:5432/email_service
          DB_USERNAME: storeuser
          DB_PASSWORD: storepassword
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t email-service:ci .
